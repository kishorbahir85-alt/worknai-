version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: worknai_backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - MONGO_URI=${MONGO_URI}
      - JWT_SECRET=${JWT_SECRET}
      - PORT=5000
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - FRONTEND_URL=${FRONTEND_URL}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - CRM_API_URL=${CRM_API_URL}
      - CRM_API_KEY=${CRM_API_KEY}
    restart: always
    networks:
      - worknai_network
    volumes:
      - ./Backend/.env:/app/.env:ro

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    container_name: worknai_frontend
    ports:
      - "3000:80"
    restart: always
    networks:
      - worknai_network
    depends_on:
      - backend

  admin:
    build:
      context: .
      dockerfile: Dockerfile.admin
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: worknai_admin
    ports:
      - "3001:80"
    restart: always
    networks:
      - worknai_network
    depends_on:
      - backend

  manager:
    build:
      context: .
      dockerfile: Dockerfile.manager
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    container_name: worknai_manager
    ports:
      - "3002:80"
    restart: always
    networks:
      - worknai_network
    depends_on:
      - backend

networks:
  worknai_network:
    driver: bridge