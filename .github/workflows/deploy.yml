name: CI/CD Deploy WorknAi

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: worknai-${{ github.ref }}
  cancel-in-progress: true

env:
  API_BASE_URL: https://api.worknai.online/api

jobs:
  build-check:
    name: Build check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          push: false

      - name: Build Frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          push: false
          build-args: |
            VITE_API_BASE_URL=${{ env.API_BASE_URL }}
            VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}

      - name: Build Admin
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.admin
          push: false
          build-args: |
            VITE_API_BASE_URL=${{ env.API_BASE_URL }}

      - name: Build Manager
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.manager
          push: false
          build-args: |
            VITE_API_BASE_URL=${{ env.API_BASE_URL }}

  deploy:
    name: Build, push, and deploy
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/worknai-backend:latest

      - name: Build and push Frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/worknai-frontend:latest
          build-args: |
            VITE_API_BASE_URL=${{ env.API_BASE_URL }}
            VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}

      - name: Build and push Admin
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.admin
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/worknai-admin:latest
          build-args: |
            VITE_API_BASE_URL=${{ env.API_BASE_URL }}

      - name: Build and push Manager
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.manager
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/worknai-manager:latest
          build-args: |
            VITE_API_BASE_URL=${{ env.API_BASE_URL }}

      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 20m
          envs: DOCKER_USERNAME,MONGODB_URI,JWT_SECRET,SMTP_USER,SMTP_PASS,GOOGLE_CLIENT_ID
          script: |
            set -e
            mkdir -p /var/www/worknai_v2
            cd /var/www/worknai_v2

            cat > docker-compose.yml <<EOF
            services:
              backend:
                image: ${DOCKER_USERNAME}/worknai-backend:latest
                container_name: worknai_v2_backend
                ports:
                  - "5001:5000"
                environment:
                  NODE_ENV: production
                  PORT: 5000
                  MONGO_URI: ${MONGODB_URI}
                  JWT_SECRET: ${JWT_SECRET}
                  SMTP_USER: ${SMTP_USER}
                  SMTP_PASS: ${SMTP_PASS}
                  FRONTEND_URL: https://worknai.online
                  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
                restart: always
                networks:
                  - worknai_v2_network

              frontend:
                image: ${DOCKER_USERNAME}/worknai-frontend:latest
                container_name: worknai_v2_frontend
                ports:
                  - "3000:80"
                restart: always
                networks:
                  - worknai_v2_network
                depends_on:
                  - backend

              admin:
                image: ${DOCKER_USERNAME}/worknai-admin:latest
                container_name: worknai_v2_admin
                ports:
                  - "3003:80"
                restart: always
                networks:
                  - worknai_v2_network
                depends_on:
                  - backend

              manager:
                image: ${DOCKER_USERNAME}/worknai-manager:latest
                container_name: worknai_v2_manager
                ports:
                  - "3002:80"
                restart: always
                networks:
                  - worknai_v2_network
                depends_on:
                  - backend

            networks:
              worknai_v2_network:
                driver: bridge
            EOF

            docker compose down --remove-orphans
            docker compose pull
            docker compose up -d
            docker image prune -f
            echo "✅ Deploy complete!"
            docker compose ps
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}