<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 160" width="100%" height="100%">
  <defs>
    <!-- Premium 3D Metallic Gold Gradients -->
    <linearGradient id="nhGoldFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A1"/>
      <stop offset="45%" stop-color="#F3C339"/>
      <stop offset="100%" stop-color="#C79213"/>
    </linearGradient>

    <linearGradient id="nhGoldShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DE9F1A"/>
      <stop offset="100%" stop-color="#8C5C05"/>
    </linearGradient>

    <linearGradient id="nhGoldMid" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#B87B08"/>
      <stop offset="50%" stop-color="#F2C542"/>
      <stop offset="100%" stop-color="#FFE885"/>
    </linearGradient>

    <linearGradient id="nhArrowHead" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2A622"/>
      <stop offset="60%" stop-color="#FDE074"/>
      <stop offset="100%" stop-color="#FFF9D2"/>
    </linearGradient>

    <filter id="nhDropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <g filter="url(#nhDropShadow)">
    <!-- NextHire 3D Golden "N" with Upward Arrow -->
    <g transform="translate(15, 12)">
      <!-- Left Vertical Ribbon Facet (Outer Shadow Side) -->
      <path d="M 12 55 L 42 120 L 58 120 L 32 55 Z" fill="url(#nhGoldShadow)"/>

      <!-- Left Vertical Main Pillar -->
      <path d="M 12 55 L 12 120 L 42 120 L 42 55 Z" fill="url(#nhGoldFace)"/>

      <!-- 3D Bevel Edge on Left Stem -->
      <polygon points="12,55 24,40 54,40 42,55" fill="url(#nhGoldMid)"/>

      <!-- Connecting Diagonal Slash Body -->
      <path d="M 42 75 L 88 126 L 105 106 L 62 55 Z" fill="url(#nhGoldShadow)"/>
      <path d="M 38 68 L 84 120 L 98 104 L 54 50 Z" fill="url(#nhGoldFace)"/>

      <!-- Right Ascending Arrow Shaft -->
      <path d="M 62 108 L 105 52 L 118 63 L 78 120 Z" fill="url(#nhGoldMid)"/>

      <!-- Upward Launching Arrow Head (Pointing ↗) -->
      <polygon points="90,58 126,20 120,68 110,60 102,68" fill="url(#nhArrowHead)"/>
      <polygon points="90,58 126,20 108,50" fill="url(#nhGoldFace)"/>

      <!-- Highlight Glint on Arrow Tip -->
      <circle cx="126" cy="20" r="2.5" fill="#FFFFFF" opacity="0.9"/>
    </g>

    <!-- Wordmark: "NextHire" -->
    <g transform="translate(160, 102)" font-family="system-ui, -apple-system, 'Plus Jakarta Sans', 'Outfit', Montserrat, sans-serif" font-weight="800" font-size="72" letter-spacing="-1.5">
      <!-- "Next" in Pure White -->
      <text x="0" y="0" fill="#FFFFFF">Next</text>
      <!-- "Hire" in Metallic Gold -->
      <text x="162" y="0" fill="url(#nhGoldFace)">Hire</text>
    </g>
  </g>
</svg>
