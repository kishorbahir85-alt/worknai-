<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <!-- Premium 3D Metallic Gold Gradients -->
    <linearGradient id="nhSquareGoldFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A1"/>
      <stop offset="45%" stop-color="#F3C339"/>
      <stop offset="100%" stop-color="#C79213"/>
    </linearGradient>

    <linearGradient id="nhSquareGoldShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DE9F1A"/>
      <stop offset="100%" stop-color="#8C5C05"/>
    </linearGradient>

    <linearGradient id="nhSquareGoldMid" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#B87B08"/>
      <stop offset="50%" stop-color="#F2C542"/>
      <stop offset="100%" stop-color="#FFE885"/>
    </linearGradient>

    <linearGradient id="nhSquareArrowHead" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2A622"/>
      <stop offset="60%" stop-color="#FDE074"/>
      <stop offset="100%" stop-color="#FFF9D2"/>
    </linearGradient>

    <filter id="nhIconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <g filter="url(#nhIconShadow)" transform="translate(8, 8) scale(0.95)">
    <!-- Left Vertical Ribbon Facet -->
    <path d="M 22 68 L 56 142 L 74 142 L 44 68 Z" fill="url(#nhSquareGoldShadow)"/>

    <!-- Left Vertical Main Pillar -->
    <path d="M 22 68 L 22 142 L 56 142 L 56 68 Z" fill="url(#nhSquareGoldFace)"/>

    <!-- 3D Bevel Top Edge on Left Stem -->
    <polygon points="22,68 36,52 70,52 56,68" fill="url(#nhSquareGoldMid)"/>

    <!-- Connecting Diagonal Slash Body -->
    <path d="M 56 90 L 108 148 L 126 124 L 78 68 Z" fill="url(#nhSquareGoldShadow)"/>
    <path d="M 52 82 L 102 142 L 118 122 L 70 62 Z" fill="url(#nhSquareGoldFace)"/>

    <!-- Right Ascending Arrow Shaft -->
    <path d="M 78 128 L 128 62 L 142 74 L 96 142 Z" fill="url(#nhSquareGoldMid)"/>

    <!-- Upward Launching Arrow Head (Pointing ↗) -->
    <polygon points="110,68 152,24 144,80 134,70 124,80" fill="url(#nhSquareArrowHead)"/>
    <polygon points="110,68 152,24 130,58" fill="url(#nhSquareGoldFace)"/>

    <!-- Highlight Glint on Arrow Tip -->
    <circle cx="152" cy="24" r="3" fill="#FFFFFF" opacity="0.95"/>
  </g>
</svg>
