<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Cyan to Coral Gradient Border -->
    <linearGradient id="mpBorderGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="35%" stop-color="#0072FF"/>
      <stop offset="70%" stop-color="#FF512F"/>
      <stop offset="100%" stop-color="#F09819"/>
    </linearGradient>

    <!-- Deep Blue Dark Tile Background -->
    <linearGradient id="mpTileBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0E1A"/>
      <stop offset="100%" stop-color="#04060C"/>
    </linearGradient>

    <!-- Glowing drop shadow -->
    <filter id="mpGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#00D2FF" flood-opacity="0.35"/>
    </filter>
  </defs>

  <g filter="url(#mpGlow)">
    <!-- Base Rounded Square Body with Outer Gradient Border -->
    <rect x="8" y="8" width="104" height="104" rx="26" fill="url(#mpTileBg)" stroke="url(#mpBorderGrad)" stroke-width="4.5"/>

    <!-- Bottom-Right Orange Accent Corner Tab -->
    <path d="M 88 108 L 102 108 A 20 20 0 0 0 108 94 L 108 84 Z" fill="#FF5E00"/>

    <!-- Meter / Speedometer Arc Dashes around Pen -->
    <path d="M 38 60 A 28 28 0 0 1 76 36" fill="none" stroke="#718096" stroke-width="3" stroke-dasharray="4.5, 4.5" stroke-linecap="round"/>

    <!-- Tilted Stylus / Digital Pen (Pointing to Bottom-Left) -->
    <g transform="rotate(-45 60 60)">
      <!-- Pen Body Nib (White) -->
      <path d="M 52 32 L 68 32 L 68 76 L 60 88 L 52 76 Z" fill="#0A0E1A" stroke="#FFFFFF" stroke-width="4.5" stroke-linejoin="round"/>
      
      <!-- Top Rounded Cap (White) -->
      <path d="M 52 32 A 8 8 0 0 1 68 32" fill="#FFFFFF"/>

      <!-- Pen Upper Accent Band (Orange) -->
      <rect x="52" y="42" width="16" height="7.5" fill="#FF5E00"/>

      <!-- Nib Tip Detail -->
      <circle cx="60" cy="85" r="1.5" fill="#FFFFFF"/>
    </g>
  </g>
</svg>
